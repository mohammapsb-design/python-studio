[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "python-studio"
version = "0.2.3"
description = "Experimental AI-assisted Python editor for Termux (Termux:GUI + Monaco). Use at your own risk."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
dependencies = ["termuxgui>=0.1.5"]

[project.scripts]
pyo = "python_studio.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
python_studio = ["assets/*.html", "assets/monaco/**/*"]
